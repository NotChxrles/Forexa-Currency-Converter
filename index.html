  <!-- Converter Dashboard -->
  <main class="max-w-3xl mx-auto mt-6 p-6 bg-white rounded shadow">

      <!-- From -->
      <div>
        <label class="block font-bold mb-2" for="fromCurrency">From:</label>
        <select id="fromCurrency" class="w-full p-2 border rounded"></select>
      </div>
      <!-- To -->
      <div>
        <label class="block font-bold mb-2" for="toCurrency">To:</label>
        <select id="toCurrency" class="w-full p-2 border rounded"></select>
      </div>
    </div>

    <!-- Amount -->
    <div class="mt-6">
      <label class="block font-bold mb-2" for="amount">Amount:</label>
      <input type="number" id="amount" class="w-full p-2 border rounded" placeholder="Enter amount" value="1" />
    </div>

    <!-- Convert Button -->
    <div class="mt-4 text-center">
      <button id="convertBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Convert</button>
    </div>

    <!-- Result -->
    <div class="mt-6 text-center text-xl font-bold" id="result">
      Converted amount will appear here
    </div>
  </main>

  <footer class="bg-gray-800 text-white text-center p-4 mt-6">

      { code: "ZAR", name: "South African Rand" },
      { code: "ZMW", name: "Zambian Kwacha" },
      { code: "ZWL", name: "Zimbabwean Dollar" }

    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const amountEl = document.getElementById('amount');
    const resultEl = document.getElementById('result');
    const convertBtn = document.getElementById('convertBtn');

    // Populate dropdowns
    function populateSelects() {
      currencies.forEach(curr => {
        const opt1 = document.createElement('option');
        opt1.value = curr.code;
        opt1.textContent = `${curr.code} - ${curr.name}`;
        fromSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = curr.code;
        opt2.textContent = `${curr.code} - ${curr.name}`;
        toSelect.appendChild(opt2);
      });

      // Optionally, set defaults
      fromSelect.value = 'USD';
      toSelect.value = 'EUR';
    }

    async function convertCurrency() {
      const from = fromSelect.value;
      const to = toSelect.value;
      const amount = parseFloat(amountEl.value);

      if (isNaN(amount) || amount <= 0) {
        resultEl.textContent = "⚠️ Please enter a valid amount!";
        return;
      }

      const url = `https://v6.exchangerate-api.com/v6/${API_KEY}/latest/${from}`;
      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.result === "success") {
          const rate = data.conversion_rates[to];
          const converted = (amount * rate).toFixed(4);
          resultEl.textContent = `${amount} ${from} = ${converted} ${to}`;
        } else {
          resultEl.textContent = `❌ API Error: ${data["error-type"] || "Unknown error"}`;
        }
      } catch (err) {
        resultEl.textContent = "🌐 Network error. Please try again later.";
        console.error(err);
      }
    }

    // Event listeners
    convertBtn.addEventListener('click', convertCurrency);
    amountEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        convertCurrency();
      }
    });

    // If user changes dropdowns, auto convert
    fromSelect.addEventListener('change', convertCurrency);
    toSelect.addEventListener('change', convertCurrency);

    // On load
    window.addEventListener('load', () => {
      populateSelects();
      convertCurrency();
    });
